<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChartVoice: hear, read and check the numbers inside a chart</title>
    <meta
      name="description"
      content="Upload a picture of a bar, line or pie chart and get a plain-language summary, a real data table, speech and sound. Built for blind, low-vision and chart-shy readers."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181c23" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="ChartVoice" />

    <!-- Link previews (Discord, WhatsApp, LinkedIn, X). Make og:image and og:url absolute once the site has a public URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChartVoice" />
    <meta property="og:title" content="ChartVoice: hear, read and check the numbers inside a chart" />
    <meta
      property="og:description"
      content="Turn a chart image into a plain-language summary, a data table, speech and sound. Built at Banana Hacks 2026."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ChartVoice logo, a speech bubble with a bar chart inside, next to a sample summary: Sales rose from 20 in January to 55 in May."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChartVoice: hear, read and check the numbers inside a chart" />
    <meta name="twitter:description" content="Turn a chart image into a plain-language summary, a data table, speech and sound." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
